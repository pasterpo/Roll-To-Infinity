<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll to Infinity</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #f4efe7;
    --bg-panel: #fffdf8;
    --line: #ded6ca;
    --text: #1d2730;
    --text-dim: #7c817e;
    --up: #e86b4d;
    --down: #277c78;
    --ink-soft: #eef2ed;
    --mono: 'DM Mono', 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(29,39,48,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,39,48,0.025) 1px, transparent 1px),
      radial-gradient(circle at 12% 18%, rgba(232,107,77,0.12), transparent 28%),
      radial-gradient(circle at 90% 78%, rgba(39,124,120,0.11), transparent 30%);
    background-size: 28px 28px, 28px 28px, auto, auto;
    color: var(--text);
    font-family: 'Manrope', 'Trebuchet MS', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
  }

  .brand {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    margin: 2px 0 40px;
    font-weight: 800;
  }
  .brand span { color: var(--up); font-size: 18px; vertical-align: -1px; }

  .gate {
    width: 100%;
    max-width: 380px;
    text-align: center;
    margin-top: 13vh;
    animation: arrive 0.6s ease both;
  }
  .gate h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(38px, 10vw, 56px);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 0.98;
  }
  .gate p {
    color: #68716e;
    font-size: 15px;
    margin: 0 0 28px;
    line-height: 1.65;
  }
  .gate input {
    width: 100%;
    background: rgba(255,253,248,0.8);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    text-align: center;
    font-family: inherit;
    box-shadow: 0 2px 0 rgba(29,39,48,0.04);
  }
  .gate input:focus { border-color: var(--up); box-shadow: 0 0 0 3px rgba(232,107,77,0.14); }
  .gate button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border-radius: 6px;
    border: none;
    background: var(--text);
    color: #fffdf8;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .gate button:hover:not(:disabled) { background: var(--up); transform: translateY(-2px); }
  .gate button:disabled { opacity: 0.4; cursor: not-allowed; }

  .game { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; animation: arrive 0.6s ease both; }
  .game.active { display: flex; }

  .greeting {
    font-size: 13px;
    color: #68716e;
    margin-bottom: 4px;
  }
  .greeting b { color: var(--text); font-weight: 600; }

  .score-frame {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px 24px 6px 24px;
    padding: 42px 20px 34px;
    margin: 18px 0 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .score-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .score-number {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    transition: color 0.25s ease;
    word-break: break-all;
  }
  .score-number.rolling { color: var(--text-dim); }
  .score-number.up { color: var(--up); text-shadow: 0 0 24px rgba(232,107,77,0.22); }
  .score-number.down { color: var(--down); text-shadow: 0 0 24px rgba(39,124,120,0.24); }

  .delta-tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    font-family: var(--mono);
    padding: 3px 10px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .delta-tag.show { opacity: 1; transform: translateY(0); }
  .delta-tag.up { background: rgba(232,107,77,0.12); color: var(--up); }
  .delta-tag.down { background: rgba(39,124,120,0.12); color: var(--down); }

  .roll-btn {
    width: 100%;
    padding: 18px;
    border-radius: 6px;
    border: none;
    background: var(--up);
    color: #fffdf8;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, opacity 0.2s ease, background 0.12s ease;
  }
  .roll-btn:hover:not(:disabled) { background: #d9573c; transform: translateY(-2px); }
  .roll-btn:active:not(:disabled) { transform: scale(0.98); }
  .roll-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .cooldown-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    height: 14px;
  }

  .board {
    width: 100%;
    margin-top: 34px;
    background: rgba(255,253,248,0.82);
    border: 1px solid var(--line);
    border-radius: 6px 6px 20px 6px;
    overflow: hidden;
  }
  .board-head {
    padding: 16px 18px 12px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  .board-row {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .board-row:last-child { border-bottom: none; }
  .board-row.me { background: var(--ink-soft); }
  .rank {
    width: 28px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
  }
  .rank.gold { color: var(--up); font-weight: 700; }
  .name { flex: 1; font-weight: 600; }
  .val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 13px;
  }
  .board-empty {
    padding: 24px 18px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

  <div class="brand">ROLL TO <span>∞</span></div>

  <div class="gate" id="gate">
    <h1>Roll to Infinity</h1>
    <p>Each roll can send your score down to earth or way past a billion. Choose a name, enter a PIN, and see where luck takes you.</p>
    <input id="usernameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off">
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="4-digit PIN" maxlength="4" autocomplete="off" style="margin-top:10px;">
    <div id="gateError" style="color:var(--down); font-size:13px; margin-top:8px; min-height:16px;"></div>
    <button id="startBtn">Start rolling</button>
  </div>

  <div class="game" id="game">
    <div class="greeting">Rolling as <b id="whoami"></b></div>

    <div class="score-frame">
      <div class="score-label">Your score</div>
      <div class="score-number" id="scoreNumber">0</div>
      <div class="delta-tag" id="deltaTag"></div>
    </div>

    <button class="roll-btn" id="rollBtn">Roll</button>
    <div class="cooldown-hint" id="cooldownHint"></div>

    <div class="board">
      <div class="board-head">Leaderboard</div>
      <div id="boardList"></div>
    </div>
  </div>

<script>
(function () {
  const signInPanel = document.getElementById('gate');
  const gameScreen = document.getElementById('game');
  const usernameInput = document.getElementById('usernameInput');
  const pinInput = document.getElementById('pinInput');
  const gateError = document.getElementById('gateError');
  const startBtn = document.getElementById('startBtn');
  const playerName = document.getElementById('whoami');
  const scoreDisplay = document.getElementById('scoreNumber');
  const changeDisplay = document.getElementById('deltaTag');
  const rollButton = document.getElementById('rollBtn');
  const cooldownMessage = document.getElementById('cooldownHint');
  const leaderboardList = document.getElementById('boardList');

  const SCORE_LIMIT = 1000000000000;
  const ROLL_DELAY = 1000;

  let username = null;
  let userKey = null;
  let score = 0;
  let hasStartedRolling = false;
  let lastRollAt = 0;
  let cooldownTimer = null;

  const firebaseConfig = {
    apiKey: "AIzaSyCHe8hLsysRCoCXrtkDRE7OBnk0Zl5_Kbs",
    authDomain: "roll-to-infinity-b8cf2.firebaseapp.com",
    databaseURL: "https://roll-to-infinity-b8cf2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "roll-to-infinity-b8cf2",
    storageBucket: "roll-to-infinity-b8cf2.firebasestorage.app",
    messagingSenderId: "828741072865",
    appId: "1:828741072865:web:1657457e62667f028404a0"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const leaderboard = database.ref('leaderboard');

  function makeFirebaseKey(name) {
    return name.replace(/[.#$\[\]\/]/g, '_');
  }

  async function findPlayer(key) {
    try {
      const snapshot = await leaderboard.child(key).once('value');
      return snapshot.val();
    } catch (error) {
      return null;
    }
  }

  async function addPlayer(key, name, pin) {
    await leaderboard.child(key).set({ name, score: 0, pin });
  }

  async function saveScore(name, value) {
    try {
      await leaderboard.child(userKey).update({ name, score: value });
    } catch (error) {
      console.error('Could not save score:', error);
    }
  }

  function renderLeaderboard(players) {
    const entries = Object.values(players || {}).sort((first, second) => second.score - first.score);
    if (entries.length === 0) {
      leaderboardList.innerHTML = '<div class="board-empty">No scores yet. Be the first to roll.</div>';
      return;
    }

    leaderboardList.innerHTML = entries.slice(0, 20).map((player, index) => {
      const rankClass = index === 0 ? 'rank gold' : 'rank';
      const rowClass = player.name === username ? 'board-row me' : 'board-row';
      return `<div class="${rowClass}">
        <div class="${rankClass}">${index + 1}</div>
        <div class="name">${escapeHtml(player.name)}</div>
        <div class="val">${formatNumber(player.score)}</div>
      </div>`;
    }).join('');
  }

  leaderboard.on('value', (snapshot) => {
    renderLeaderboard(snapshot.val());
  });

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = value;
    return element.innerHTML;
  }

  function formatNumber(value) {
    return value.toLocaleString('en-US');
  }

  function randomInteger(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function roll() {
    const now = Date.now();
    if (now - lastRollAt < ROLL_DELAY) return;
    lastRollAt = now;

    let newScore;
    let direction;

    if (!hasStartedRolling) {
      newScore = randomInteger(0, SCORE_LIMIT);
      direction = 'up';
      hasStartedRolling = true;
    } else {
      const goLower = Math.random() < 0.5;
      if (goLower) {
        newScore = randomInteger(0, score);
        direction = newScore < score ? 'down' : (newScore > score ? 'up' : null);
      } else {
        const nextMinimum = Math.min(score + 1, SCORE_LIMIT);
        newScore = randomInteger(nextMinimum, SCORE_LIMIT);
        direction = 'up';
      }
    }

    animateRoll(newScore, direction);
  }

  function animateRoll(finalScore, direction) {
    rollButton.disabled = true;
    rollButton.textContent = 'Rolling...';
    scoreDisplay.classList.add('rolling');
    scoreDisplay.classList.remove('up', 'down');
    changeDisplay.classList.remove('show');

    let frame = 0;
    const animation = setInterval(() => {
      scoreDisplay.textContent = formatNumber(randomInteger(0, SCORE_LIMIT));
      frame += 1;
      if (frame >= 10) {
        clearInterval(animation);
        landRoll(finalScore, direction);
      }
    }, 45);
  }

  function landRoll(finalScore, direction) {
    const prevScore = score;
    score = finalScore;

    scoreDisplay.classList.remove('rolling');
    scoreDisplay.textContent = formatNumber(score);

    if (direction === 'up') {
      scoreDisplay.classList.add('up');
      changeDisplay.textContent = '▲ ' + formatChange(prevScore, score);
      changeDisplay.className = 'delta-tag up show';
    } else if (direction === 'down') {
      scoreDisplay.classList.add('down');
      changeDisplay.textContent = '▼ ' + formatChange(prevScore, score);
      changeDisplay.className = 'delta-tag down show';
    } else {
      changeDisplay.textContent = 'no change';
      changeDisplay.className = 'delta-tag show';
    }

    saveScore(username, score);

    startCooldownUI();
  }

  function formatChange(prev, curr) {
    const diff = Math.abs(curr - prev);
    return formatNumber(diff);
  }

  function startCooldownUI() {
    let remaining = ROLL_DELAY;
    rollButton.disabled = true;
    rollButton.textContent = 'Wait...';
    if (cooldownTimer) clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 100;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        cooldownMessage.textContent = '';
        rollButton.disabled = false;
        rollButton.textContent = 'Roll';
      } else {
        cooldownMessage.textContent = 'next roll in ' + (remaining / 1000).toFixed(1) + 's';
      }
    }, 100);
  }

  function isValidPin(pin) {
    return /^[0-9]{4}$/.test(pin);
  }

  async function startGame(name, pin) {
    const key = makeFirebaseKey(name);
    const existing = await findPlayer(key);

    if (existing) {
      if (existing.pin !== pin) {
        gateError.textContent = 'Wrong PIN for that name. Try again.';
        return;
      }
      score = existing.score || 0;
      hasStartedRolling = true;
    } else {
      await addPlayer(key, name, pin);
      score = 0;
      hasStartedRolling = false;
    }

    username = name;
    userKey = key;
    playerName.textContent = name;
    scoreDisplay.textContent = formatNumber(score);
    signInPanel.style.display = 'none';
    gameScreen.classList.add('active');
  }

  startBtn.addEventListener('click', async () => {
    const name = usernameInput.value.trim();
    const pin = pinInput.value.trim();
    gateError.textContent = '';

    if (!name) {
      gateError.textContent = 'Enter a name.';
      usernameInput.focus();
      return;
    }
    if (!isValidPin(pin)) {
      gateError.textContent = 'PIN must be exactly 4 digits.';
      pinInput.focus();
      return;
    }

    startBtn.disabled = true;
    await startGame(name, pin);
    startBtn.disabled = false;
  });

  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') pinInput.focus();
  });
  pinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startBtn.click();
  });

  rollButton.addEventListener('click', roll);
})();
</script>

</body>
</html>
