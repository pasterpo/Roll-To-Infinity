<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll to Infinity</title>
<style>
  :root {
    --bg: #f5f5f5;
    --bg-panel: #ffffff;
    --line: #dddddd;
    --text: #222222;
    --text-dim: #777777;
    --up: #e66b2f;
    --down: #277a78;
    --ink-soft: #f1f6f4;
    --mono: Consolas, 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  .brand {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 8px 0 40px;
  }
  .brand span { color: var(--text); }

  .gate {
    width: 100%;
    max-width: 380px;
    text-align: center;
    margin-top: 18vh;
  }
  .gate h1 {
    font-size: 28px;
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: 0;
  }
  .gate p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .gate input {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    text-align: center;
    font-family: inherit;
  }
  .gate input:focus { border-color: var(--up); }
  .gate button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border-radius: 6px;
    border: none;
    background: var(--up);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .gate button:hover:not(:disabled) { opacity: 0.9; }
  .gate button:disabled { opacity: 0.4; cursor: not-allowed; }

  .game { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; }
  .game.active { display: flex; }

  .greeting {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .greeting b { color: var(--text); font-weight: 600; }

  .score-frame {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 36px 20px 30px;
    margin: 18px 0 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .score-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .score-number {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    transition: color 0.25s ease;
    word-break: break-all;
  }
  .score-number.rolling { color: var(--text-dim); }
  .score-number.up { color: var(--up); }
  .score-number.down { color: var(--down); }

  .delta-tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    font-family: var(--mono);
    padding: 3px 10px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .delta-tag.show { opacity: 1; transform: translateY(0); }
  .delta-tag.up { background: #fff0e9; color: var(--up); }
  .delta-tag.down { background: #e9f4f2; color: var(--down); }

  .roll-btn {
    width: 100%;
    padding: 18px;
    border-radius: 6px;
    border: none;
    background: var(--up);
    color: #ffffff;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
  }
  .roll-btn:hover:not(:disabled) { opacity: 0.9; }
  .roll-btn:active:not(:disabled) { transform: scale(0.98); }
  .roll-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .cooldown-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    height: 14px;
  }

  .board {
    width: 100%;
    margin-top: 34px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .board-head {
    padding: 16px 18px 12px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  .board-row {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .board-row:last-child { border-bottom: none; }
  .board-row.me { background: var(--ink-soft); }
  .rank {
    width: 28px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
  }
  .rank.gold { color: var(--up); font-weight: 700; }
  .name { flex: 1; font-weight: 600; }
  .val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 13px;
  }
  .board-empty {
    padding: 24px 18px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

  <div class="brand">ROLL TO <span>∞</span></div>

  <div class="gate" id="gate">
    <h1>Roll to Infinity</h1>
    <p>Each roll can send your score down to earth or way past a billion. Choose a name and see where luck takes you.</p>
    <input id="usernameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off">
    <div id="gateError" style="color:var(--down); font-size:13px; margin-top:8px; min-height:16px;"></div>
    <button id="startBtn">Start rolling</button>
  </div>

  <div class="game" id="game">
    <div class="greeting">Rolling as <b id="whoami"></b></div>

    <div class="score-frame">
      <div class="score-label">Your score</div>
      <div class="score-number" id="scoreNumber">0</div>
      <div class="delta-tag" id="deltaTag"></div>
    </div>

    <button class="roll-btn" id="rollBtn">Roll</button>
    <div class="cooldown-hint" id="cooldownHint"></div>

    <div class="board">
      <div class="board-head">Leaderboard</div>
      <div id="boardList"></div>
    </div>
  </div>

<script>
(function () {
  const signInPanel = document.getElementById('gate');
  const gameScreen = document.getElementById('game');
  const usernameInput = document.getElementById('usernameInput');
  const gateError = document.getElementById('gateError');
  const startBtn = document.getElementById('startBtn');
  const playerName = document.getElementById('whoami');
  const scoreDisplay = document.getElementById('scoreNumber');
  const changeDisplay = document.getElementById('deltaTag');
  const rollButton = document.getElementById('rollBtn');
  const cooldownMessage = document.getElementById('cooldownHint');
  const leaderboardList = document.getElementById('boardList');

  const SCORE_LIMIT = 1000000000000;
  const ROLL_DELAY = 1000;

  let username = null;
  let userKey = null;
  let score = 0;
  let hasStartedRolling = false;
  let lastRollAt = 0;
  let cooldownTimer = null;
  let currentUser = null;
  const API_URL = 'https://roll-to-infinity.ar-project.workers.dev';
  let playerToken = localStorage.getItem('rollPlayerToken');

  const firebaseConfig = {
    apiKey: "AIzaSyCHe8hLsysRCoCXrtkDRE7OBnk0Zl5_Kbs",
    authDomain: "roll-to-infinity-b8cf2.firebaseapp.com",
    databaseURL: "https://roll-to-infinity-b8cf2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "roll-to-infinity-b8cf2",
    storageBucket: "roll-to-infinity-b8cf2.firebasestorage.app",
    messagingSenderId: "828741072865",
    appId: "1:828741072865:web:1657457e62667f028404a0"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  currentUser = auth.currentUser;
  const database = firebase.database();
  const leaderboard = database.ref('publicLeaderboard');

  async function api(path, options = {}) {
    const response = await fetch(API_URL + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(playerToken ? { 'x-player-token': playerToken } : {}), ...(options.headers || {}) }
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Request failed.');
    return data;
  }

  async function loadLeaderboard() {
    const players = await api('/leaderboard');
    renderLeaderboard(Object.fromEntries(players.map((player) => [player.name, player])));
  }

  function playerPath(uid) {
    return leaderboard.child(uid);
  }

  function namePath(name) {
    return database.ref('nameClaims').child(encodeURIComponent(name.toLowerCase()));
  }

  async function loadPlayer(uid) {
    const snapshot = await playerPath(uid).once('value');
    return snapshot.val();
  }

  async function savePlayer(uid, name, value) {
    await playerPath(uid).set({ name, score: value });
  }

  async function claimName(name, uid) {
    const result = await namePath(name).transaction((owner) => owner || uid);
    return result.committed && result.snapshot.val() === uid;
  }

  function renderLeaderboard(players) {
    const entries = Object.values(players || {}).sort((first, second) => second.score - first.score);
    if (entries.length === 0) {
      leaderboardList.innerHTML = '<div class="board-empty">No scores yet. Be the first to roll.</div>';
      return;
    }

    leaderboardList.innerHTML = entries.slice(0, 20).map((player, index) => {
      const rankClass = index === 0 ? 'rank gold' : 'rank';
      const rowClass = player.name === username ? 'board-row me' : 'board-row';
      return `<div class="${rowClass}">
        <div class="${rankClass}">${index + 1}</div>
        <div class="name">${escapeHtml(player.name)}</div>
        <div class="val">${formatNumber(player.score)}</div>
      </div>`;
    }).join('');
  }

  loadLeaderboard().catch((error) => { gateError.textContent = error.message; });

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = value;
    return element.innerHTML;
  }

  function formatNumber(value) {
    return value.toLocaleString('en-US');
  }

  function randomInteger(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function roll() {
    const now = Date.now();
    if (now - lastRollAt < ROLL_DELAY) return;
    lastRollAt = now;
    api('/roll', { method: 'POST', body: '{}' })
      .then((result) => animateRoll(result.score, result.direction))
      .then(loadLeaderboard)
      .catch((error) => { cooldownMessage.textContent = error.message; rollButton.disabled = false; });
  }

  function animateRoll(finalScore, direction) {
    rollButton.disabled = true;
    rollButton.textContent = 'Rolling...';
    scoreDisplay.classList.add('rolling');
    scoreDisplay.classList.remove('up', 'down');
    changeDisplay.classList.remove('show');

    let frame = 0;
    const animation = setInterval(() => {
      scoreDisplay.textContent = formatNumber(randomInteger(0, SCORE_LIMIT));
      frame += 1;
      if (frame >= 10) {
        clearInterval(animation);
        landRoll(finalScore, direction);
      }
    }, 45);
  }

  function landRoll(finalScore, direction) {
    const prevScore = score;
    score = finalScore;

    scoreDisplay.classList.remove('rolling');
    scoreDisplay.textContent = formatNumber(score);

    if (direction === 'up') {
      scoreDisplay.classList.add('up');
      changeDisplay.textContent = '▲ ' + formatChange(prevScore, score);
      changeDisplay.className = 'delta-tag up show';
    } else if (direction === 'down') {
      scoreDisplay.classList.add('down');
      changeDisplay.textContent = '▼ ' + formatChange(prevScore, score);
      changeDisplay.className = 'delta-tag down show';
    } else {
      changeDisplay.textContent = 'no change';
      changeDisplay.className = 'delta-tag show';
    }

    startCooldownUI();
  }

  function formatChange(prev, curr) {
    const diff = Math.abs(curr - prev);
    return formatNumber(diff);
  }

  function startCooldownUI() {
    let remaining = ROLL_DELAY;
    rollButton.disabled = true;
    rollButton.textContent = 'Wait...';
    if (cooldownTimer) clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 100;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        cooldownMessage.textContent = '';
        rollButton.disabled = false;
        rollButton.textContent = 'Roll';
      } else {
        cooldownMessage.textContent = 'next roll in ' + (remaining / 1000).toFixed(1) + 's';
      }
    }, 100);
  }

  async function startGame(name) {
    const result = await api('/register', { method: 'POST', body: JSON.stringify({ name }) });
    playerToken = result.token;
    localStorage.setItem('rollPlayerToken', playerToken);
    username = result.name;
    score = result.score;
    hasStartedRolling = true;
    playerName.textContent = username;
    scoreDisplay.textContent = formatNumber(score);
    signInPanel.style.display = 'none';
    gameScreen.classList.add('active');
  }

  startBtn.addEventListener('click', async () => {
    const name = usernameInput.value.trim();
    gateError.textContent = '';

    if (!name) {
      gateError.textContent = 'Enter a name.';
      usernameInput.focus();
      return;
    }
    startBtn.disabled = true;
    try {
      await startGame(name);
    } catch (error) {
      console.error('Could not start game:', error);
      gateError.textContent = 'Could not connect securely. Try again.';
    }
    startBtn.disabled = false;
  });

  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startBtn.click();
  });

  rollButton.addEventListener('click', roll);
})();
</script>

</body>
</html>
